# Publica o site no GitHub Pages a cada push na main:
# https://<usuario>.github.io/<repositorio>/
# Esta cópia é de visualização: fica marcada para não ser indexada pelos buscadores.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Definir endereço do site
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          echo "BASE_PATH=/${repo}/" >> "$GITHUB_ENV"
          echo "VITE_SITE_URL=https://${owner}.github.io/${repo}" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build
        env:
          VITE_NOINDEX: 'true'
          PRERENDER_DIR_INDEX: 'true'

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
